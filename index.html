<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: usa a tela inteira em celulares com notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Links</title>
  <meta name="description" content="Todos os nossos links em um só lugar." />

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind via CDN (prototipagem rápida) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'system-ui', 'sans-serif'] } } } };
  </script>

  <style>
    html, body { min-height: 100%; }
    body { font-family: 'Outfit', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

    /* ---------- Botões ---------- */
    .link-btn {
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
      box-shadow: 0 6px 18px -8px rgba(30, 20, 80, .35);
    }
    .link-btn:hover  { transform: translateY(-2px) scale(1.012); box-shadow: 0 12px 24px -10px rgba(30, 20, 80, .4); }
    .link-btn:active { transform: scale(.975); box-shadow: 0 3px 10px -6px rgba(30, 20, 80, .4); filter: brightness(.96); }
    .link-btn:focus-visible { outline: 3px solid rgba(30, 20, 80, .65); outline-offset: 3px; }

    /* ---------- Destaque animado: pulso discreto com anel ---------- */
    .destaque { animation: pulso 2.4s ease-in-out infinite; position: relative; }
    .destaque::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      box-shadow: 0 0 0 0 var(--anel, rgba(37, 211, 102, .55));
      animation: anel 2.4s ease-out infinite; pointer-events: none;
    }
    @keyframes pulso { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes anel { 0% { box-shadow: 0 0 0 0 var(--anel, rgba(37,211,102,.55)); } 70%, 100% { box-shadow: 0 0 0 14px rgba(0,0,0,0); } }
    .destaque:hover, .destaque:active { animation-play-state: paused; }

    /* ---------- Entrada única da página ---------- */
    .entrada { animation: entrada .55s ease-out both; }
    @keyframes entrada { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* Respeita quem prefere menos movimento */
    @media (prefers-reduced-motion: reduce) {
      .destaque, .destaque::after, .entrada { animation: none !important; }
      .link-btn { transition: none; }
    }
  </style>
</head>

<body class="antialiased">
  <!-- Fundo e conteúdo são montados pelo JavaScript a partir de dadosCliente -->
  <div id="app" class="min-h-screen w-full flex justify-center"></div>

  <script>
    /* =====================================================================
       ✏️  ÁREA DO CLIENTE — ALTERE SOMENTE ESTE BLOCO PARA CADA NOVO CLIENTE
       Simula a resposta de um banco de dados / API.
       ===================================================================== */
    const dadosCliente = {
      // Nome exibido abaixo da foto
      nome: "Padaria Pão Quente",

      // @ do Instagram (ou outro). Escreva sem o "@", ele é adicionado automaticamente
      usuario: "padariapaoquente",

      // Frase curta opcional sob o @ (deixe "" para esconder)
      descricao: "Pães fresquinhos todo dia, das 6h às 20h.",

      // URL da foto de perfil (quadrada, de preferência). Se falhar, aparecem as iniciais do nome
      foto: "https://placehold.co/300x300/F59E0B/FFFFFF?text=PQ",

      // TEMA
      // tipo: "gradiente" ou "solido"  |  valor: qualquer CSS de background válido
      tema: {
        tipo: "gradiente",
        valor: "linear-gradient(160deg, #FFE3EC 0%, #E6E1FF 48%, #CFEFFF 100%)",
        // Para fundo sólido, use por exemplo:  tipo: "solido", valor: "#FDF2E9"
        corTexto: "#1E1B3A",          // nome, @ e descrição
        corBotao: "#FFFFFF",          // fundo dos botões comuns
        corTextoBotao: "#1E1B3A",     // texto/ícone dos botões comuns
        corBordaFoto: "rgba(255,255,255,.9)" // borda da foto de perfil
      },

      // LINKS (aparecem na ordem da lista)
      // texto:    o que está escrito no botão
      // url:      destino (WhatsApp: https://wa.me/55DDDNUMERO?text=Mensagem)
      // icone:    whatsapp | instagram | facebook | tiktok | youtube | cardapio | localizacao |
      //           telefone | site | pix | avaliacao | email | link
      // destaque: true = botão com animação de pulso | false = botão normal
      // cor / corTexto (opcionais): cores próprias do botão, ótimo para o destaque
      links: [
        {
          texto: "Peça pelo WhatsApp",
          url: "https://wa.me/5511999999999?text=Ol%C3%A1!%20Vim%20pelo%20link%20e%20quero%20fazer%20um%20pedido.",
          icone: "whatsapp",
          destaque: true,
          cor: "#25D366",
          corTexto: "#FFFFFF"
        },
        { texto: "Ver cardápio",           url: "https://exemplo.com.br/cardapio",        icone: "cardapio",    destaque: false },
        { texto: "Como chegar",            url: "https://maps.google.com/?q=Padaria+Pao+Quente", icone: "localizacao", destaque: false },
        { texto: "Siga no Instagram",      url: "https://instagram.com/padariapaoquente", icone: "instagram",   destaque: false },
        { texto: "Avalie no Google",       url: "https://g.page/r/SEU-CODIGO/review",     icone: "avaliacao",   destaque: false }
      ],

      // Rodapé (normalmente não precisa mexer)
      rodape: { texto: "Desenvolvido por ImpulsoWeb10", url: "" } // coloque o site da agência em url, se quiser link
    };
    /* ===================== FIM DA ÁREA DO CLIENTE ===================== */


    /* =====================================================================
       ÍCONES (SVG inline, herdam a cor do texto do botão). Não precisa editar.
       ===================================================================== */
    const ICONES = {
      whatsapp:    '<path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.2-.4.700-1.300a.5.5 0 0 0 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.900 11.900 0 0 0 4.600 4c1.700.7 2.400.8 3.200.7a2.700 2.700 0 0 0 1.800-1.300 2.200 2.200 0 0 0 .2-1.300c-.1-.1-.3-.2-.5-.3Z"/>',
      instagram:   '<path d="M7.500 2h9A5.500 5.500 0 0 1 22 7.500v9a5.500 5.500 0 0 1-5.500 5.500h-9A5.500 5.500 0 0 1 2 16.500v-9A5.500 5.500 0 0 1 7.500 2Zm0 1.800A3.700 3.700 0 0 0 3.800 7.500v9a3.700 3.700 0 0 0 3.700 3.700h9a3.700 3.700 0 0 0 3.700-3.700v-9a3.700 3.700 0 0 0-3.700-3.700h-9ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 1.800a3.200 3.200 0 1 0 0 6.400 3.200 3.200 0 0 0 0-6.400Zm5.300-2.600a1.200 1.200 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400Z"/>',
      facebook:    '<path d="M13.500 22v-8.200h2.800l.4-3.300h-3.200V8.400c0-.9.300-1.600 1.600-1.600h1.700V3.900A22 22 0 0 0 14.400 3.800c-2.500 0-4.200 1.500-4.200 4.300v2.400H7.400v3.300h2.800V22h3.300Z"/>',
      tiktok:      '<path d="M16.600 2h-3.200v13.100a2.900 2.900 0 1 1-2-2.700V9.100a6.100 6.100 0 1 0 5.200 6V8.700a7.500 7.500 0 0 0 4.300 1.400V6.900A4.300 4.300 0 0 1 16.600 2Z"/>',
      youtube:     '<path d="M21.600 7.200a2.600 2.600 0 0 0-1.800-1.800C18.200 5 12 5 12 5s-6.200 0-7.800.4A2.600 2.600 0 0 0 2.400 7.200C2 8.800 2 12 2 12s0 3.200.4 4.800a2.600 2.600 0 0 0 1.800 1.800C5.800 19 12 19 12 19s6.200 0 7.800-.4a2.600 2.600 0 0 0 1.800-1.800c.4-1.600.4-4.800.4-4.800s0-3.200-.4-4.800ZM10 15V9l5.200 3L10 15Z"/>',
      cardapio:    '<path d="M7 2v8.500a2 2 0 0 1-1.500 1.900V22h-2V12.400A2 2 0 0 1 2 10.500V2h1.600v6h1V2H7Zm10.500 0c1.700 1.500 2.500 4 2.500 6.500 0 2-.9 3.400-2 4V22h-2V2h1.500Z"/>',
      localizacao: '<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5Z"/>',
      telefone:    '<path d="M6.600 10.800a15.200 15.200 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.2 11.400 11.400 0 0 0 3.600.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.300.2 2.500.6 3.600a1 1 0 0 1-.2 1l-2.300 2.200Z"/>',
      site:        '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.900 9h-3.100a15.700 15.700 0 0 0-1.400-6A8.100 8.100 0 0 1 18.900 11ZM12 4c.9 1.200 1.700 3.300 1.900 7h-3.800C10.300 7.300 11.100 5.200 12 4ZM4.100 13h3.100a15.700 15.700 0 0 0 1.400 6A8.100 8.100 0 0 1 4.100 13Zm3.100-2H4.100a8.100 8.100 0 0 1 4.500-6 15.700 15.700 0 0 0-1.400 6Zm4.800 9c-.9-1.200-1.700-3.300-1.900-7h3.800c-.2 3.700-1 5.800-1.900 7Zm3.400-1a15.700 15.700 0 0 0 1.400-6h3.100a8.100 8.100 0 0 1-4.500 6Z"/>',
      pix:         '<path d="m12 2.600 3.400 3.400-1.700 1.700L12 6l-1.700 1.700L8.600 6 12 2.600ZM2.600 12 6 8.600l1.700 1.700L6 12l1.700 1.700L6 15.400 2.600 12Zm18.800 0L18 15.400l-1.700-1.700L18 12l-1.700-1.700L18 8.600l3.400 3.400ZM12 21.400 8.600 18l1.700-1.700L12 18l1.700-1.700 1.700 1.700-3.400 3.400Zm0-6.700L9.300 12 12 9.300l2.700 2.700-2.700 2.700Z"/>',
      avaliacao:   '<path d="m12 2.500 2.900 6 6.600.9-4.800 4.600 1.200 6.500L12 17.300l-5.900 3.200 1.200-6.500L2.500 9.400l6.600-.9L12 2.500Z"/>',
      email:       '<path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm9 7.200L4.500 7v.2L12 12.800 19.500 7.200V7L12 12.200Z"/>',
      link:        '<path d="M10.600 13.400a1 1 0 0 1 0-1.400l3-3a3 3 0 1 1 4.200 4.200l-1.500 1.500-1.400-1.400 1.500-1.500a1 1 0 0 0-1.400-1.400l-3 3a1 1 0 0 1-1.400 0ZM13.400 10.600a1 1 0 0 1 0 1.400l-3 3a3 3 0 0 1-4.200-4.200l1.500-1.500 1.400 1.400-1.500 1.500a1 1 0 0 0 1.400 1.400l3-3a1 1 0 0 1 1.400 0Z"/>'
    };

    function criarIcone(nome) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'currentColor');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('class', 'w-6 h-6 shrink-0');
      svg.innerHTML = ICONES[nome] || ICONES.link; // conteúdo vem do dicionário acima, nunca do cliente
      return svg;
    }

    /* =====================================================================
       RENDERIZAÇÃO — lê dadosCliente e monta a página. Não precisa editar.
       ===================================================================== */
    function el(tag, classes, texto) {
      const e = document.createElement(tag);
      if (classes) e.className = classes;
      if (texto !== undefined) e.textContent = texto; // textContent evita injeção de HTML
      return e;
    }

    function iniciais(nome) {
      return nome.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
    }

    function renderizar(d) {
      const app = document.getElementById('app');
      const t = d.tema;

      // Fundo + título da aba
      document.body.style.background = t.valor;
      document.body.style.backgroundAttachment = 'fixed';
      document.body.style.color = t.corTexto;
      document.title = `${d.nome} | Links`;

      // Coluna central: celular = tela cheia, desktop = largura máxima de app
      const coluna = el('main', 'entrada w-full max-w-md px-5 pt-12 pb-8 flex flex-col items-center min-h-screen');
      coluna.style.paddingTop = 'max(3rem, env(safe-area-inset-top))';
      coluna.style.paddingBottom = 'max(2rem, env(safe-area-inset-bottom))';

      // Foto de perfil circular com borda sutil
      const moldura = el('div', 'w-28 h-28 rounded-full overflow-hidden flex items-center justify-center shadow-lg');
      moldura.style.border = `4px solid ${t.corBordaFoto}`;
      moldura.style.background = '#ffffff55';
      const img = el('img', 'w-full h-full object-cover');
      img.src = d.foto;
      img.alt = `Foto de perfil de ${d.nome}`;
      img.onerror = () => { // se a imagem falhar, mostra as iniciais
        img.remove();
        const fallback = el('span', 'text-3xl font-bold', iniciais(d.nome));
        moldura.appendChild(fallback);
      };
      moldura.appendChild(img);
      coluna.appendChild(moldura);

      // Nome, @ e descrição
      coluna.appendChild(el('h1', 'mt-4 text-2xl font-bold text-center leading-tight', d.nome));
      if (d.usuario) {
        const u = el('p', 'mt-1 text-base font-medium opacity-70', '@' + d.usuario.replace(/^@/, ''));
        coluna.appendChild(u);
      }
      if (d.descricao) {
        coluna.appendChild(el('p', 'mt-3 text-center text-[15px] leading-snug opacity-80 max-w-xs', d.descricao));
      }

      // Lista de botões
      const lista = el('nav', 'mt-8 w-full flex flex-col gap-4');
      lista.setAttribute('aria-label', 'Links');

      d.links.forEach(link => {
        const a = el('a', 'link-btn relative flex items-center justify-center gap-3 w-full rounded-full py-[18px] px-14 text-[17px] font-semibold text-center');
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        // Cores: do próprio link (opcional) ou do tema
        const bg = link.cor || t.corBotao;
        const fg = link.corTexto || t.corTextoBotao;
        a.style.background = bg;
        a.style.color = fg;

        if (link.destaque) {
          a.classList.add('destaque');
          if (link.cor) a.style.setProperty('--anel', hexParaRgba(link.cor, .5));
        }

        // Ícone à esquerda (posição absoluta mantém o texto centralizado)
        const icone = criarIcone(link.icone);
        icone.classList.add('absolute', 'left-6');
        a.appendChild(icone);
        a.appendChild(el('span', '', link.texto));
        lista.appendChild(a);
      });
      coluna.appendChild(lista);

      // Rodapé discreto
      const rodape = el('footer', 'mt-auto pt-12 text-xs opacity-60 text-center');
      if (d.rodape.url) {
        const r = el('a', 'underline underline-offset-2', d.rodape.texto);
        r.href = d.rodape.url; r.target = '_blank'; r.rel = 'noopener noreferrer';
        rodape.appendChild(r);
      } else {
        rodape.textContent = d.rodape.texto;
      }
      coluna.appendChild(rodape);

      app.replaceChildren(coluna);
    }

    // Converte #RRGGBB em rgba() para o anel do pulso
    function hexParaRgba(hex, alpha) {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!m) return `rgba(0,0,0,${alpha})`;
      return `rgba(${parseInt(m[1], 16)}, ${parseInt(m[2], 16)}, ${parseInt(m[3], 16)}, ${alpha})`;
    }

    renderizar(dadosCliente);
  </script>
</body>
</html>
